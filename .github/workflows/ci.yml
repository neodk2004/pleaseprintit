name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python test_app.py
      - run: python test_models.py
      - run: python test_preview.py
      - run: python test_i18n.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose-Dateien prüfen
        env:
          ADMIN_PASSWORD: ci
          SECRET_KEY: ci
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.dockhand.yaml config -q
      - uses: docker/setup-qemu-action@v3
      - name: Image bauen und starten (x86 und ARM, z. B. Raspberry Pi)
        run: |
          for arch in amd64 arm64; do
            docker build --platform linux/$arch -t ppi-$arch .
            docker run -d --name app-$arch --platform linux/$arch -p 8080:8000 -e ADMIN_PASSWORD=ci -e SECRET_KEY=ci ppi-$arch
            ok=
            for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && ok=1 && break; sleep 2; done
            [ "$ok" ] || { docker logs app-$arch; exit 1; }
            echo "$arch: $(docker exec app-$arch uname -m) läuft"
            docker rm -f app-$arch
          done

  # Fertiges Image auf ghcr.io für amd64 und arm64 – nur wenn Tests und Probestart grün sind
  publish:
    if: github.event_name == 'push'
    needs: [tests, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
